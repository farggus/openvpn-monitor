name: Deploy via SSH

# Развёртывание на homeserver. Ключ PROD_SSH_KEY разрешён на сервере ровно для одной
# команды: sudo /usr/local/sbin/deploy openvpn-monitor <режим>. Текст script ниже
# передаётся ей как режим: deploy — развернуть main, ping — только проверить связь.
# Сервер сам делает git fetch + fast-forward и docker compose build/up; при расхождении
# истории или правках в каталоге развёртывания — отказ.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy — развернуть main; ping — только проверить связь"
        default: deploy
        required: false
        type: choice
        options: [deploy, ping]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: ${{ inputs.mode || 'deploy' }}
